modLoader = "javafml"
loaderVersion = "[4,)"
license = "GPL-3.0"

[[mods]]
modId = "xbce"
version = "${version}"
displayName = "xb's Creature Enhancement"
authors = "xbodwf"
logoFile = "icon.png"
description = '''
All's fair in war - mobs disguise themselves as friendly creatures!
'''

[[mixins]]
config = "xbce.neoforge.mixins.json"

# Create 专用 mixin（接管官方 create:copper_casing 的自然氧化与打蜡）。
# 目标类属于可选依赖 create，因此单独放一个 required=false 的配置：
# 没装 Create 时 Mixin 只记一条 WARN 并跳过，不会像 required=true 那样启动崩溃。
[[mixins]]
config = "xbce.create.mixins.json"

[[dependencies.xbce]]
modId = "neoforge"
type = "required"
versionRange = "[21,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.xbce]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,)"
ordering = "NONE"
side = "BOTH"

# Create 6.x 软联动（铜传动杆家族）：不装也能玩，装了之后在 Create 之后加载
[[dependencies.xbce]]
modId = "create"
type = "optional"
versionRange = "[6.0.10,)"
ordering = "AFTER"
side = "BOTH"
